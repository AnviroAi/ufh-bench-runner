# The UFH layout benchmark on GitHub's free runners.
# This public repo holds ONLY this file and a README. The engine code, the floor plans and the results stay in the private
# backend repo: each job checks them out with the secret BENCH_TOKEN, every run's output is encrypted (secret BENCH_KEY) before it
# is stored as an artifact, and the summary is pushed back to the private repo. Started by hand only (Actions tab), never by pull
# requests, so no fork can reach the secrets.
name: UFH benchmark

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Backend branch or commit to test"
        required: true
        default: "main"
      runs:
        description: "Which runs: a list in tools/bench/lists (all, window_bands, join_bends, ...) or run ids separated by commas"
        required: true
        default: "all"
      tools_ref:
        description: "Backend branch that holds tools/bench (the benchmark set and scripts)"
        required: true
        default: "ci/40-bench-runner"
      baseline:
        description: "Baseline in tools/bench/baselines to compare with"
        required: true
        default: "bench2"
      issue:
        description: "Backend issue number to post the summary on (empty: none)"
        required: false
        default: ""

permissions:
  contents: read

env:
  BACKEND: AnviroAi/underfloor_heating_plan_backend
  PYTHON_VERSION: "3.10"

jobs:
  plan:
    name: Plan the runs
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.list.outputs.runs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Check out the run lists (private)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.BACKEND }}
          ref: ${{ inputs.tools_ref }}
          token: ${{ secrets.BENCH_TOKEN }}
          path: tools-repo
          sparse-checkout: tools/bench/lists
          persist-credentials: false
      - name: Make the run list
        id: list
        env:
          RUNS: ${{ inputs.runs }}
        shell: python
        run: |
          import json, os, re
          want = os.environ["RUNS"].strip()
          lists = "tools-repo/tools/bench/lists"
          if re.fullmatch(r"[A-Za-z0-9_]+", want) and os.path.exists(f"{lists}/{want}.txt"):
              runs = [l.strip() for l in open(f"{lists}/{want}.txt") if l.strip()]
          else:
              runs = [r.strip() for r in want.split(",") if r.strip()]
          bad = [r for r in runs if not re.fullmatch(r"(service|set)_[0-9a-f]{8}_\d{3}_(uniform|mixed)", r)]
          if bad or not runs:
              raise SystemExit(f"not a run list or run id: {bad or want}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"runs={json.dumps(runs)}\ncount={len(runs)}\n")
          print(f"{len(runs)} runs")

  run:
    name: ${{ matrix.run }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - name: Check out the code to test (private)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.BACKEND }}
          ref: ${{ inputs.code_ref }}
          token: ${{ secrets.BENCH_TOKEN }}
          path: code
          sparse-checkout: app
          persist-credentials: false
      - name: Check out the benchmark tools (private)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.BACKEND }}
          ref: ${{ inputs.tools_ref }}
          token: ${{ secrets.BENCH_TOKEN }}
          path: tools-repo
          sparse-checkout: tools/bench
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools-repo/tools/bench/requirements.txt
      - name: Install the engine's packages
        run: |
          python -m pip install --quiet -r tools-repo/tools/bench/requirements.txt
          python -m pip install --quiet --no-deps ortools==9.15.6755
          # without OR-Tools the service quietly uses the old grid engine: stop here instead of comparing a different engine
          python tools-repo/tools/bench/check_env.py
      - name: Run (output kept private)
        env:
          RUN: ${{ matrix.run }}
        run: |
          mkdir -p "out/$RUN"
          set -a; . tools-repo/tools/bench/switches.env; set +a
          # the engine's log names rooms and prints coordinates, and a crash prints source lines: all of it goes to a file
          python tools-repo/tools/bench/run_one.py "$RUN" code "out/$RUN" > "out/$RUN/engine.log" 2>&1 || true
          python tools-repo/tools/bench/one_line.py "$RUN" "out/$RUN/row.json"
      - name: Encrypt the output
        env:
          RUN: ${{ matrix.run }}
          BENCH_KEY: ${{ secrets.BENCH_KEY }}
        run: |
          tar czf - -C out "$RUN" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BENCH_KEY -out "$RUN.tgz.enc"
          rm -rf out
      - name: Keep the encrypted output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.run }}
          path: ${{ matrix.run }}.tgz.enc
          retention-days: 7
          if-no-files-found: error

  summary:
    name: Summary
    needs: [plan, run]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the benchmark tools (private)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.BACKEND }}
          ref: ${{ inputs.tools_ref }}
          token: ${{ secrets.BENCH_TOKEN }}
          path: tools-repo
          sparse-checkout: tools/bench
          persist-credentials: false
      - name: Fetch every run's encrypted output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: enc
      - name: Decrypt and compare with the baseline
        id: sum
        env:
          BENCH_KEY: ${{ secrets.BENCH_KEY }}
          RUNS: ${{ needs.plan.outputs.runs }}
          BASELINE: ${{ inputs.baseline }}
          CODE_REF: ${{ inputs.code_ref }}
          RUN_NO: ${{ github.run_number }}
        run: |
          mkdir -p results
          for f in enc/*/*.tgz.enc; do
            [ -e "$f" ] || continue
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BENCH_KEY -in "$f" | tar xzf - -C results
          done
          printf '%s' "$RUNS" > results/_runs.json
          set +e
          verdict=$(python tools-repo/tools/bench/summarize.py results "tools-repo/tools/bench/baselines/$BASELINE.json" summary.md \
                      "--title=Benchmark of $CODE_REF (run $RUN_NO)")
          code=$?
          set -e
          echo "$verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "Details are in the private backend repo, branch bench-results." >> "$GITHUB_STEP_SUMMARY"
      - name: Store the results in the private repo (branch bench-results)
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          CODE_REF: ${{ inputs.code_ref }}
          RUN_NO: ${{ github.run_number }}
          VERDICT: ${{ steps.sum.outputs.verdict }}
        run: |
          safe=$(printf '%s' "$CODE_REF" | tr -c 'A-Za-z0-9._-' '_')
          dest="runs/$(date -u +%Y-%m-%d)_${safe}_run${RUN_NO}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${BACKEND}.git"
          if git ls-remote --exit-code --heads "$url" bench-results > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch bench-results "$url" store
          else
            git init --quiet store
            git -C store checkout --quiet -b bench-results
            git -C store remote add origin "$url"
          fi
          mkdir -p "store/$dest"
          cp summary.md "store/$dest/"
          for d in results/*/; do
            run=$(basename "$d")
            mkdir -p "store/$dest/$run"
            cp "$d/row.json" "store/$dest/$run/" 2>/dev/null || true
            gzip -c "$d/engine.log" > "store/$dest/$run/engine.log.gz" 2>/dev/null || true
          done
          cd store
          git config user.name "ufh-bench-runner"
          git config user.email "ufh-bench-runner@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Benchmark of $CODE_REF (run $RUN_NO): $VERDICT"
          for i in 1 2 3; do
            git push --quiet origin bench-results && break
            git pull --quiet --rebase origin bench-results
          done
          echo "Stored in the private repo: branch bench-results, folder $dest" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the summary on the backend issue
        if: ${{ inputs.issue != '' }}
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          ISSUE: ${{ inputs.issue }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "issue must be a number"; exit 1;; esac
          gh issue comment "$ISSUE" --repo "$BACKEND" --body-file summary.md > /dev/null
      - name: Fail when a run got worse
        if: ${{ steps.sum.outputs.code != '0' }}
        run: exit 1
